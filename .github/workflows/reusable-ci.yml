name: Reusable CI

# ------------------------------------------------------------------------------
# Lint + typecheck + build + tests + security scan for any Gundo project.
# Supports multi-workspace pnpm monorepos (backend, frontend, or both).
#
# Usage:
#   jobs:
#     ci:
#       uses: jplannnou/gundo-workflows/.github/workflows/reusable-ci.yml@v1
#       with:
#         workspaces: 'backend,frontend'
#       secrets:
#         NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label. gundo-local = self-hosted (default hosted por compatibilidad).'
        type: string
        default: 'ubuntu-latest'
      run-lint:
        description: 'Correr lint. false = repo aun sin config de ESLint estandar (adopcion por fases).'
        type: boolean
        default: true
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      pnpm-version:
        description: 'pnpm version (should match all Gundo projects)'
        type: string
        default: '10.30.1'
      workspaces:
        description: 'Comma-separated list of pnpm workspaces to build'
        type: string
        default: 'backend,frontend'
      run-tests:
        description: 'Run unit tests'
        type: boolean
        default: true
      run-trivy:
        description: 'Run Trivy dependency + filesystem scan'
        type: boolean
        default: true
      trivy-severity:
        description: 'Trivy severity threshold that fails the job'
        type: string
        default: 'HIGH,CRITICAL'
      working-directory:
        description: 'Root directory when repo is not a monorepo root'
        type: string
        default: '.'
    secrets:
      NODE_AUTH_TOKEN:
        description: 'GitHub Packages read token for @jplannnou/* private packages'
        required: false

jobs:
  prepare:
    name: Resolve workspace matrix
    runs-on: ${{ inputs.runner }}
    outputs:
      workspaces: ${{ steps.split.outputs.json }}
    steps:
      # GitHub Actions NO tiene funcion replace() en sus expresiones, asi que la
      # lista separada por comas se parte aca con jq. El matrix hardcodeado con
      # replace() daba startup_failure (jobs vacios) — nunca se noto porque el
      # reusable no tenia consumidores.
      - id: split
        run: echo "json=$(echo '${{ inputs.workspaces }}' | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  workspace-matrix:
    name: Build workspace
    needs: prepare
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.prepare.outputs.workspaces) }}
    defaults:
      run:
        # matrix.workspace ya es la ruta efectiva (default '.'); para repos
        # anidados el caller pasa workspaces con la subruta (ej. 'apps/api').
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          # setup-node rechaza '.' en el glob ('././pnpm-lock.yaml' invalido),
          # asi que en single-package (workspace='.') va la ruta raiz pelada.
          cache-dependency-path: ${{ matrix.workspace == '.' && 'pnpm-lock.yaml' || format('{0}/pnpm-lock.yaml', matrix.workspace) }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jplannnou'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Lint
        if: inputs.run-lint
        run: pnpm lint

      - name: Typecheck
        run: |
          if pnpm run | grep -q '^  typecheck'; then
            pnpm typecheck
          else
            pnpm exec tsc --noEmit
          fi

      - name: Build
        run: pnpm build

      - name: Test
        if: inputs.run-tests
        run: |
          # Correr el test script tal cual lo define el repo. El intento previo
          # de forzar flags ('-- --run --passWithNoTests') rompia jest: pnpm
          # reenvia el '--' literal y jest toma '--passWithNoTests' como PATRON
          # de nombre, filtrando los specs a 0 (user-engine-api: 50 suites -> 0).
          # Repos sin tests caen al else y se saltean.
          if pnpm run | grep -q '^  test'; then
            pnpm test
          else
            echo "No test script defined; skipping"
          fi

      - name: Upload build artifacts
        if: matrix.workspace == 'backend' || matrix.workspace == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.workspace }}-${{ github.sha }}
          path: |
            ${{ matrix.workspace }}/dist
            ${{ matrix.workspace }}/build
          retention-days: 7
          if-no-files-found: ignore

  security-scan:
    name: Security scan
    runs-on: ${{ inputs.runner }}
    if: inputs.run-trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ github.run_id }}

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
