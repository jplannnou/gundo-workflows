name: Reusable Cloud Run Preview

# ------------------------------------------------------------------------------
# On a pull_request event, deploy a Cloud Run preview revision with
# --no-traffic + tag=pr-<number>. Access it via tagged URL:
#   https://pr-123---<service>-<hash>-<region>.a.run.app
#
# Comments the preview URL on the PR.
#
# When the PR is closed, the accompanying cleanup workflow removes the tag
# (see templates/preview-cleanup.yml for a copy-paste example).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label del runner self-hosted: `gundo-local` en los repos del org,
          `jp-local` en los privados personales. Sin default a proposito: un
          default alojado convertia cada olvido en minutos de pago silenciosos.
        type: string
        required: true
      gcp-project:
        type: string
        required: true
      gcp-region:
        type: string
        default: 'us-central1'
      service:
        type: string
        required: true
      image:
        description: 'Full image URI (from reusable-build-sign)'
        type: string
        required: true
      workload-identity-provider:
        type: string
        required: true
      service-account:
        type: string
        required: true
      runtime-service-account:
        type: string
        required: true
      memory:
        type: string
        default: '512Mi'
      cpu:
        type: string
        default: '1'
      env-vars:
        type: string
        default: ''
      secrets-mapping:
        type: string
        default: ''
    outputs:
      preview-url:
        value: ${{ jobs.preview.outputs.url }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token

      # Sin descargas de raw.githubusercontent.com cuando el runner ya trae
      # gcloud: `setup-gcloud` con `latest` baja de ahi `versions.json` en cada
      # job y ese host responde 503 a la IP de la workstation (ver
      # reusable-build-sign.yml). Si gcloud no esta, se instala como antes.
      # `scripts/validate-workflow-contracts.sh` exige este cableado.
      - name: Detectar gcloud ya instalado en el runner
        id: runner-tools
        run: |
          gcloud_ok=false
          gcloud_version=''
          if command -v gcloud >/dev/null 2>&1; then
            gcloud_version=$(gcloud version --format='value("Google Cloud SDK")' 2>/dev/null || true)
          fi
          # 363.0.0 es el minimo que setup-gcloud documenta para Workload Identity.
          # Se compara el numero mayor en bash puro: `sort -V` no esta en todos los runners.
          gcloud_major="${gcloud_version%%.*}"
          if [[ "$gcloud_major" =~ ^[0-9]+$ ]] && (( gcloud_major >= 363 )); then
            gcloud_ok=true
            echo "gcloud ${gcloud_version} ya instalado en $(command -v gcloud): no se descarga"
          else
            echo "gcloud no esta en el runner o es anterior a 363.0.0 ('${gcloud_version}'): se instala"
          fi
          echo "gcloud=${gcloud_ok}" >> "$GITHUB_OUTPUT"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: ${{ steps.runner-tools.outputs.gcloud == 'true' }}

      - name: Deploy preview revision
        id: deploy
        run: |
          PR_TAG="pr-${{ github.event.pull_request.number }}"
          FLAGS="--image=${{ inputs.image }}"
          FLAGS="$FLAGS --region=${{ inputs.gcp-region }}"
          FLAGS="$FLAGS --project=${{ inputs.gcp-project }}"
          FLAGS="$FLAGS --service-account=${{ inputs.runtime-service-account }}"
          FLAGS="$FLAGS --memory=${{ inputs.memory }} --cpu=${{ inputs.cpu }}"
          FLAGS="$FLAGS --no-traffic --tag=$PR_TAG"
          if [ -n "${{ inputs.env-vars }}" ]; then
            FLAGS="$FLAGS --set-env-vars=${{ inputs.env-vars }}"
          fi
          if [ -n "${{ inputs.secrets-mapping }}" ]; then
            FLAGS="$FLAGS --set-secrets=${{ inputs.secrets-mapping }}"
          fi
          gcloud run deploy ${{ inputs.service }} $FLAGS

          URL=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --format="value(status.traffic[?tag='$PR_TAG'].url)" | head -1)

          if [ -z "$URL" ]; then
            URL=$(gcloud run services describe ${{ inputs.service }} \
              --region=${{ inputs.gcp-region }} \
              --project=${{ inputs.gcp-project }} \
              --format="value(status.url)")
            URL=$(echo "$URL" | sed "s|https://|https://$PR_TAG---|")
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudrun-preview-${{ inputs.service }}
          message: |
            ### Cloud Run preview deployed

            | Service | URL |
            |---|---|
            | `${{ inputs.service }}` | [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }}) |

            Revision is isolated (0% production traffic). Tag `pr-${{ github.event.pull_request.number }}` will be removed when this PR closes.
