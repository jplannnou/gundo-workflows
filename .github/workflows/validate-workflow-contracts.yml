name: Validate workflow contracts

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shared workflow invariants
        run: bash scripts/validate-workflow-contracts.sh
