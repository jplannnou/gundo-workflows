name: Validate workflow contracts

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shared workflow invariants
        run: bash scripts/validate-workflow-contracts.sh
      - name: Cosign security and compatibility floors
        run: node --test scripts/test-cosign-security-floor.mjs
      - name: Stage-only deployment contract
        run: node --test scripts/test-stage-only-deploy-contract.mjs
      - name: Canary failure reporter contract
        run: node --test scripts/test-report-canary-failure.mjs
      - name: Trivy installer offline regression and mutation tests
        run: node --test scripts/test-trivy-installer.mjs
      - name: Trivy database concurrent cache isolation
        run: node --test scripts/test-trivy-cache-isolation.mjs
      - name: Runner Docker cache admission and GC coordination
        run: node --test scripts/test-runner-docker-cache-guard.mjs
      - name: Trivy withdrawn-advisory gate
        run: node --test scripts/test-gate-trivy-report.mjs
      # Cada contrato de descargas se rompe a proposito en una copia y el
      # validador debe rechazarlo con su error: si alguien debilita una regla,
      # este paso se pone rojo.
      - name: Mutation-test the validator
        run: bash scripts/test-validate-workflow-contracts.sh
