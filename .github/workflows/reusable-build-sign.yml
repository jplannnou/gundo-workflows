name: Reusable Build + Sign

# ------------------------------------------------------------------------------
# Build a Docker image, push to Artifact Registry, sign with Cosign (keyless
# OIDC), and generate a SPDX SBOM with syft.
#
# Outputs:
#   image:         Full image URI with digest (region-docker.pkg.dev/.../svc@sha256:...)
#   image-tag:     Tag used (github.sha)
#   sbom-artifact: Name of uploaded SBOM artifact
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label del runner self-hosted: `gundo-local` en los repos del org,
          `jp-local` en los privados personales. Sin default a proposito: un
          default alojado convertia cada olvido en minutos de pago silenciosos.
        type: string
        required: true
      gcp-project:
        description: 'GCP project ID (e.g. gundo-content-engine)'
        type: string
        required: true
      gcp-region:
        description: 'GCP region for Artifact Registry'
        type: string
        default: 'us-central1'
      service:
        description: 'Cloud Run service name / image name'
        type: string
        required: true
      artifact-repo:
        description: 'Artifact Registry repository name'
        type: string
        default: 'gundo'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      build-context:
        description: 'Docker build context directory'
        type: string
        default: '.'
      build-args:
        description: 'Newline-separated KEY=VALUE build args'
        type: string
        default: ''
      workload-identity-provider:
        description: 'Full resource name of WIF provider'
        type: string
        required: true
      service-account:
        description: 'Service account email used by the build'
        type: string
        required: true
    outputs:
      image:
        description: 'Full image URI including digest'
        value: ${{ jobs.build.outputs.image }}
      image-tag:
        description: 'Tag used for this build'
        value: ${{ jobs.build.outputs.image-tag }}
      digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  id-token: write   # Required for WIF and Cosign keyless signing
  packages: write

jobs:
  build:
    name: Build + push + sign
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image-tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token

      # `skip_install`: el gcloud del runner, sin descargar nada. Sin él, la
      # acción baja `versions.json` de raw.githubusercontent.com en cada
      # ejecución, y ese dominio devolvió 503 a ratos el 12-09-2026 (medido
      # desde WSL: 503 503 503 200 200 200, con githubstatus en «operativo»):
      # tumbó dos despliegues de gundo-user-engine-api. Todos los que llaman a
      # este workflow pasan `gundo-local` o `jp-local`, runners de la misma WSL
      # con gcloud 577 (con beta y alpha) visible para el usuario `runner`.
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_BASE="${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project }}/${{ inputs.artifact-repo }}/${{ inputs.service }}"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image-base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull cache image (best-effort)
        run: |
          docker pull ${{ steps.meta.outputs.image-base }}:latest || echo "No cache image yet"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image-base }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image-base }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image-base }}:latest
          cache-to: type=inline
          provenance: true
          sbom: false   # We generate our own below with syft (more control)

      # 🔴 Sin `sigstore/cosign-installer`: bajaba la clave pública de sigstore de
      # raw.githubusercontent.com en cada ejecución, y ese dominio falló a ratos
      # el 12-09-2026 (`curl` exit 22): tumbó dos despliegues de user-engine.
      #
      # Binario de las releases de github.com en $RUNNER_TEMP (en WSL2 el runner
      # no es sudoer y /usr/local/bin da exit 23), con el SHA-256 de v2.4.1
      # fijado: sacado de `cosign_checksums.txt` y recalculado sobre la descarga.
      # Conserva la verificación que hacía el instalador; cambiar la versión sin
      # cambiar el hash hace fallar el paso.
      - name: Install Cosign
        env:
          COSIGN_VERSION: v2.4.1
          COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/bin/cosign"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cosign" version

      - name: Sign image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image-base }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$IMAGE_REF"
          echo "Signed: $IMAGE_REF"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX JSON)
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image-base }}@${{ steps.push.outputs.digest }}"
          syft "$IMAGE_REF" -o spdx-json > sbom-${{ github.sha }}.spdx.json
          echo "SBOM generated for $IMAGE_REF"

      - name: Attach SBOM attestation (Cosign)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image-base }}@${{ steps.push.outputs.digest }}"
          cosign attest --yes \
            --predicate sbom-${{ github.sha }}.spdx.json \
            --type spdx \
            "$IMAGE_REF"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json
          retention-days: 90

      - name: Scan image with Trivy (post-build gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image-base }}@${{ steps.push.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
