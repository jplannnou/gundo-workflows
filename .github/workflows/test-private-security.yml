name: Test private security workflow

on:
  pull_request:
    branches: [v1]
    paths:
      - ".github/workflows/reusable-private-security.yml"
      - ".github/workflows/test-private-security.yml"
      - "scripts/validate-workflow-contracts.sh"
  push:
    branches: [v1]
    paths:
      - ".github/workflows/reusable-private-security.yml"
      - ".github/workflows/test-private-security.yml"
      - "scripts/validate-workflow-contracts.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-real-scan:
    uses: ./.github/workflows/reusable-private-security.yml
    with:
      runner-label: jp-local
      vulnerability-severity: CRITICAL
      self-test: true
