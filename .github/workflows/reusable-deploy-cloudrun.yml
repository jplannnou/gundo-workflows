name: Reusable Cloud Run Deploy (canary + auto-rollback)

# ------------------------------------------------------------------------------
# Deploy a signed, SBOM-attested Docker image to Cloud Run with canary
# strategy:
#   1. Deploy new revision with --no-traffic and tag=canary-<sha>
#   2. Shift 10% traffic to canary
#   3. Watch SLO (error rate, p95 latency) for `canary-duration` seconds
#   4. If SLO holds: promote to 100%
#   5. If SLO breaks: rollback to the revision that was serving pre-deploy
#
# Reports deployment lifecycle to Feedback Hub (/api/devops/deployments).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      gcp-project:
        type: string
        required: true
      gcp-region:
        type: string
        default: 'us-central1'
      service:
        description: 'Cloud Run service name'
        type: string
        required: true
      image:
        description: 'Full image URI (from reusable-build-sign outputs)'
        type: string
        required: true
      workload-identity-provider:
        type: string
        required: true
      service-account:
        description: 'SA used by the deploy job (NOT the Cloud Run runtime SA)'
        type: string
        required: true
      runtime-service-account:
        description: 'SA that the Cloud Run service runs as'
        type: string
        required: true
      secrets-mapping:
        description: 'Comma-separated MOUNT=SECRET:VERSION pairs for --set-secrets'
        type: string
        default: ''
      env-vars:
        description: 'Comma-separated KEY=VALUE pairs for --set-env-vars'
        type: string
        default: ''
      memory:
        type: string
        default: '1Gi'
      cpu:
        type: string
        default: '1'
      concurrency:
        type: number
        default: 80
      timeout:
        type: string
        default: '300'
      min-instances:
        type: number
        default: 0
      max-instances:
        type: number
        default: 10
      canary-percent:
        description: 'Traffic percentage sent to canary during watch'
        type: number
        default: 10
      canary-duration-seconds:
        description: 'How long to watch the canary before promoting'
        type: number
        default: 300
      max-error-rate:
        description: 'Error rate (0-1) that triggers rollback'
        type: number
        default: 0.01
      max-p95-latency-ms:
        description: 'p95 latency in ms that triggers rollback'
        type: number
        default: 1500
      skip-canary:
        description: 'If true, deploy directly to 100% (emergency use only)'
        type: boolean
        default: false
      feedback-hub-url:
        description: 'Base URL of Feedback Hub API'
        type: string
        default: 'https://gundo-content-engine-xlpp333cua-uc.a.run.app'
      public-access:
        description: |
          Grant `allUsers/run.invoker` at the service level so unauthenticated
          requests are allowed (required for any public B2C/marketing service).
          Idempotent — safe to leave `true` across deploys. Default `false` so
          private/internal services (admin tools, backend APIs behind auth) are
          not accidentally exposed.

          IMPORTANT: without this, Cloud Run only allows public traffic if some
          OTHER mechanism granted allUsers (e.g. a one-off `gcloud add-iam-policy-binding`
          or — historically — a tag-pinned binding). Tag-pinned bindings vanish
          when `--remove-tags` runs, taking the entire service down silently.
          Setting this `true` makes the binding service-level and immune.
          See incident memory `incident-cloud-run-remove-tags-strips-iam-2026-05-08.md`.
        type: boolean
        default: false
    secrets:
      FEEDBACK_HUB_API_KEY:
        description: 'API key for Feedback Hub /api/devops endpoints'
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write # abrir/actualizar un issue "deploy fallido" (aviso ruidoso)

jobs:
  deploy:
    name: Canary deploy
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      revision: ${{ steps.deploy-new.outputs.revision }}
    steps:
      - name: Checkout gundo-workflows scripts
        uses: actions/checkout@v5
        with:
          repository: jplannnou/gundo-workflows
          ref: v1
          path: .gundo-workflows

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify image signature (Cosign)
        run: |
          curl -L https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
          COSIGN_EXPERIMENTAL=1 cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ inputs.image }}"

      - name: Report deploy started
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="building" \
            --author="${{ github.actor }}"

      - name: Build deploy flags
        id: flags
        run: |
          FLAGS="--image=${{ inputs.image }}"
          FLAGS="$FLAGS --region=${{ inputs.gcp-region }}"
          FLAGS="$FLAGS --project=${{ inputs.gcp-project }}"
          FLAGS="$FLAGS --service-account=${{ inputs.runtime-service-account }}"
          FLAGS="$FLAGS --memory=${{ inputs.memory }} --cpu=${{ inputs.cpu }}"
          FLAGS="$FLAGS --concurrency=${{ inputs.concurrency }} --timeout=${{ inputs.timeout }}"
          FLAGS="$FLAGS --min-instances=${{ inputs.min-instances }}"
          FLAGS="$FLAGS --max-instances=${{ inputs.max-instances }}"
          if [ -n "${{ inputs.env-vars }}" ]; then
            FLAGS="$FLAGS --set-env-vars=${{ inputs.env-vars }}"
          fi
          if [ -n "${{ inputs.secrets-mapping }}" ]; then
            FLAGS="$FLAGS --set-secrets=${{ inputs.secrets-mapping }}"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      # Service-level IAM grant for public access. Idempotent — re-applying the
      # same binding is a no-op. Runs BEFORE the canary deploy so the new
      # revision is reachable from outside the moment traffic shifts to it.
      # If `public-access: false` (default), this step is skipped and any
      # existing IAM stays intact (we never REMOVE bindings here).
      - name: Grant public access (allUsers/run.invoker) at service level
        if: inputs.public-access == true
        run: |
          gcloud run services add-iam-policy-binding ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --member=allUsers \
            --role=roles/run.invoker

      # ------------------------------------------------------------------------
      # OBJETIVO DEL ROLLBACK — se calcula ANTES de desplegar nada.
      #
      # Antes esto se resolvía buscando una revisión con la etiqueta
      # `stable=true`. Esa etiqueta NO EXISTÍA NUNCA. Medido en producción:
      #
      #   gcloud run revisions list --project project-genie-ue \
      #     --region europe-west1 --filter="metadata.labels.stable=true"
      #   WARNING: The following filter keys were not present in any resource :
      #            metadata.labels.stable
      #
      # Cero revisiones la tenían, en ningún servicio. Motivo de fondo: las
      # revisiones de Cloud Run son INMUTABLES — la Admin API no expone ningún
      # método para modificar sus labels, y por eso `gcloud run revisions`
      # solo tiene `list`, `describe` y `delete`. No hay ningún `update`.
      # Cualquier intento de etiquetar a posteriori falla con
      # "Invalid choice: 'update'". Es decir: no era que se nos hubiera
      # olvidado poner la etiqueta, es que no se puede poner.
      #
      # DECISIÓN: no se persiste ninguna marca en GCP. El objetivo del
      # rollback se captura aquí, en caliente, leyendo qué revisión está
      # sirviendo justo antes de desplegar. Ventajas frente a la etiqueta:
      #   - No hay problema de arranque. Con etiquetas, el PRIMER deploy tras
      #     el cambio no tendría ninguna revisión marcada y el rollback se
      #     quedaría sin destino. Aquí el primer deploy ya está protegido,
      #     porque toda revisión que sirve tráfico es un destino válido.
      #   - "Exactamente una estable por servicio" sale gratis: es un valor
      #     calculado, no un estado que haya que mantener sincronizado.
      #   - Refleja la realidad aunque alguien haya movido el tráfico a mano.
      #
      # Se elige la revisión con MÁS tráfico, no la que tenga exactamente 100%,
      # para cubrir el caso de un run anterior abortado a mitad de canary que
      # dejara el reparto partido (p.ej. 90/10).
      - name: Capturar revisión que sirve ahora (objetivo del rollback)
        id: current
        if: inputs.skip-canary == false
        run: |
          set -uo pipefail
          SERVING=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --format=json 2>/dev/null \
            | jq -r '[.status.traffic[]? | select((.percent // 0) > 0)]
                     | max_by(.percent) | .revisionName // empty' || true)

          if [ -z "$SERVING" ]; then
            # Servicio nuevo: aún no hay nada sirviendo. No es un error aquí —
            # el deploy sigue. Es el step de Rollback el que decidirá qué hacer
            # si llega a hacer falta (ver su comentario).
            echo "::warning::No hay revisión sirviendo tráfico todavía (servicio nuevo). El rollback automático no tendrá destino en este deploy."
          else
            echo "::notice::Objetivo de rollback si el canary incumple el SLO: $SERVING"
          fi
          echo "revision=$SERVING" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision (no traffic)
        id: deploy-new
        if: inputs.skip-canary == false
        run: |
          REVISION_TAG="canary-${{ github.sha }}"
          gcloud run deploy ${{ inputs.service }} \
            ${{ steps.flags.outputs.flags }} \
            --no-traffic \
            --tag=$REVISION_TAG

          # `status.traffic[0]` NO es la revisión recién creada: la lista de
          # tráfico empieza por las entradas con tag (canarios viejos que
          # quedaron colgados), así que devolvía una revisión de hace meses.
          # Medido en genie-api: traffic[0] = genie-api-00912-teg mientras la
          # revisión nueva era genie-api-01633-fox. Eso hacía que el watch
          # vigilara una revisión con 0% de tráfico → 0 peticiones → siempre
          # por debajo de MIN_REQUESTS → el SLO no se comprobaba NUNCA y el
          # canary no podía fallar. `latestCreatedRevisionName` sí es la nueva.
          REVISION=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --format='value(status.latestCreatedRevisionName)')
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$REVISION_TAG" >> "$GITHUB_OUTPUT"

      - name: Shift traffic to canary
        if: inputs.skip-canary == false
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-tags=${{ steps.deploy-new.outputs.tag }}=${{ inputs.canary-percent }}

      - name: Report canary started
        if: inputs.skip-canary == false
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="canary" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --traffic-percent=${{ inputs.canary-percent }}

      - name: Watch canary SLO
        id: watch
        if: inputs.skip-canary == false
        continue-on-error: true
        run: |
          bash .gundo-workflows/scripts/canary-watch.sh \
            --service="${{ inputs.service }}" \
            --project="${{ inputs.gcp-project }}" \
            --region="${{ inputs.gcp-region }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --duration=${{ inputs.canary-duration-seconds }} \
            --max-error-rate=${{ inputs.max-error-rate }} \
            --max-p95-ms=${{ inputs.max-p95-latency-ms }}

      - name: Promote canary to 100%
        id: promote
        if: inputs.skip-canary == false && steps.watch.outcome == 'success'
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-tags=${{ steps.deploy-new.outputs.tag }}=100

          # Aquí NO se etiqueta nada. El intento anterior era
          # `gcloud run revisions update --update-labels=stable=true`, un
          # comando que no existe en ninguna pista de gcloud (ni beta ni
          # alpha), porque las revisiones de Cloud Run son inmutables. Fallaba
          # siempre; y como el `update-traffic` de arriba ya había corrido, el
          # tráfico sí se promovía y el fallo solo dejaba el job en rojo.
          # El objetivo del rollback ya se capturó antes de desplegar.

      # El rollback se dispara cuando el watch sale con código 1, lo que ocurre
      # EN MEDIO de la ventana de observación (canary-watch.sh aborta en cuanto
      # acumula 2 ventanas seguidas incumpliendo el SLO), no solo al final. Por
      # eso el destino se captura antes del deploy: en ese camino la promoción
      # nunca llega a ejecutarse, así que no puede depender de nada que la
      # promoción hubiera dejado escrito.
      - name: Rollback
        id: rollback
        if: inputs.skip-canary == false && steps.watch.outcome == 'failure'
        run: |
          STABLE_REVISION="${{ steps.current.outputs.revision }}"

          if [ -z "$STABLE_REVISION" ]; then
            # Solo alcanzable en el primer deploy absoluto de un servicio, con
            # el canary ya incumpliendo el SLO. Se falla con un mensaje claro
            # en vez de caer a "la revisión anterior por orden de creación":
            # en un servicio recién creado esa revisión nunca sirvió tráfico
            # (puede venir de un deploy abortado o de otra configuración), así
            # que mandarle el 100% sería una apuesta a ciegas. Peor que parar.
            echo "::error::No hay revisión previa a la que volver: este es el primer deploy del servicio y el canary ya incumple el SLO. El tráfico sigue en la revisión nueva. Revisa los logs de arranque y despliega un arreglo, o borra el servicio si nunca llegó a funcionar."
            exit 1
          fi

          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-revisions=$STABLE_REVISION=100

          echo "Rolled back to $STABLE_REVISION"
          echo "stable-revision=$STABLE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy direct (skip canary, emergency)
        if: inputs.skip-canary == true
        run: |
          gcloud run deploy ${{ inputs.service }} \
            ${{ steps.flags.outputs.flags }}

      - name: Determine outcome
        id: outcome
        if: always()
        run: |
          # "promoted" se decide por el resultado de la PROMOCIÓN, no por el del
          # watch. Antes bastaba con que el watch saliera bien: si el
          # `update-traffic` de la promoción fallaba, el tráfico se quedaba en
          # el 10% del canary y aun así se reportaba "promoted" (y el aviso
          # ruidoso no saltaba, porque solo salta si el estado no es promoted).
          if [ "${{ inputs.skip-canary }}" = "true" ]; then
            echo "status=promoted" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.promote.outcome }}" = "success" ]; then
            echo "status=promoted" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "status=rolled_back" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report final status
        if: always()
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="${{ steps.outcome.outputs.status }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}"

      # Aviso RUIDOSO cuando el deploy no promueve. El job ya queda en rojo, pero
      # una X en Actions es fácil de no mirar: así gundo-payments-api sirvió una
      # revisión vieja durante varias versiones sin que nadie se enterara (el
      # contenedor nuevo no arrancaba → canary unhealthy → rollback → tráfico
      # congelado). Aquí se abre (o comenta) un issue en el repo que despliega,
      # que sí notifica. Nunca hace fallar el deploy por sí mismo (best-effort).
      - name: Aviso ruidoso si el deploy no promovió
        if: always() && steps.outcome.outputs.status != 'promoted'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ inputs.service }}
          STATUS: ${{ steps.outcome.outputs.status }}
          REVISION: ${{ steps.deploy-new.outputs.revision }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="🔴 Deploy no promovió: ${SERVICE} — el tráfico NO está en la última revisión"
          BODY=$(cat <<EOF
          El deploy de \`${SERVICE}\` terminó con estado **${STATUS}**: la revisión nueva no tomó el 100% del tráfico (rollback o fallo). **La versión nueva NO está sirviendo** — producción quedó en la revisión anterior.

          - **Commit:** \`${GITHUB_SHA}\`
          - **Revisión intentada:** \`${REVISION:-desconocida}\`
          - **Run:** ${RUN_URL}

          **Qué revisar primero:** logs de arranque de la revisión en Cloud Run (\`Container called exit(1)\`, \`failed to start and listen on PORT\`). Causa típica: el contenedor no bootea aunque \`nest build\`/\`docker build\` pasen (patrón "built ≠ boots"; ver gundo-payments-api #43). Cerrar este issue cuando el deploy vuelva a promover.
          EOF
          )
          # Reutiliza un issue abierto del mismo servicio si existe; si no, lo crea.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title Deploy no promovió: ${SERVICE}" \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Comentado en issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" \
              --label deploy-failed 2>/dev/null \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail job if rolled back or failed
        if: steps.outcome.outputs.status != 'promoted'
        run: |
          echo "::error::Deploy ended with status ${{ steps.outcome.outputs.status }}"
          exit 1
