name: Reusable Cloud Run Deploy (canary + auto-rollback)

# ------------------------------------------------------------------------------
# Deploy a signed, SBOM-attested Docker image to Cloud Run with canary
# strategy:
#   1. Deploy new revision with --no-traffic and tag=canary-<sha>
#   2. Shift 10% traffic to canary
#   3. Watch SLO (error rate, p95 latency) for `canary-duration` seconds
#   4. If SLO holds: promote to 100% + tag stable
#   5. If SLO breaks: rollback to previous stable revision
#
# Reports deployment lifecycle to Feedback Hub (/api/devops/deployments).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      gcp-project:
        type: string
        required: true
      gcp-region:
        type: string
        default: 'us-central1'
      service:
        description: 'Cloud Run service name'
        type: string
        required: true
      image:
        description: 'Full image URI (from reusable-build-sign outputs)'
        type: string
        required: true
      workload-identity-provider:
        type: string
        required: true
      service-account:
        description: 'SA used by the deploy job (NOT the Cloud Run runtime SA)'
        type: string
        required: true
      runtime-service-account:
        description: 'SA that the Cloud Run service runs as'
        type: string
        required: true
      secrets-mapping:
        description: 'MOUNT=SECRET:VERSION pairs for --set-secrets, separated by `env-vars-separator`'
        type: string
        default: ''
      env-vars:
        description: 'KEY=VALUE pairs for --set-env-vars, separated by `env-vars-separator`'
        type: string
        default: ''
      env-vars-separator:
        description: |
          Custom delimiter for env-vars / secrets-mapping. Default `,`. Pass `||`
          (or any non-comma char) when values contain commas (URLs, lists). The
          step prepends the gcloud sentinel `^<sep>^` automatically.
        type: string
        default: ','
      memory:
        type: string
        default: '1Gi'
      cpu:
        type: string
        default: '1'
      concurrency:
        type: number
        default: 80
      timeout:
        type: string
        default: '300'
      min-instances:
        type: number
        default: 0
      max-instances:
        type: number
        default: 10
      canary-percent:
        description: 'Traffic percentage sent to canary during watch'
        type: number
        default: 10
      canary-duration-seconds:
        description: 'How long to watch the canary before promoting'
        type: number
        default: 300
      max-error-rate:
        description: 'Error rate (0-1) that triggers rollback'
        type: number
        default: 0.01
      max-p95-latency-ms:
        description: 'p95 latency in ms that triggers rollback'
        type: number
        default: 1500
      skip-canary:
        description: 'If true, deploy directly to 100% (emergency use only)'
        type: boolean
        default: false
      cpu-boost:
        description: 'Enable CPU boost on startup (faster cold starts)'
        type: boolean
        default: false
      session-affinity:
        description: 'Enable session affinity (sticky sessions)'
        type: boolean
        default: false
      allow-unauthenticated:
        description: |
          If true, passes `--allow-unauthenticated` to `gcloud run deploy` AND
          re-binds `allUsers/run.invoker` at the SERVICE level after every
          `update-traffic` call (promote, rollback, cleanup). The initial
          `gcloud run deploy --allow-unauthenticated` is NOT enough on its
          own: the subsequent `update-traffic --remove-tags=canary-X` call
          re-serializes the service config and silently drops the public
          binding. We discovered this 2026-05-21 when gundo-ecommerce-ui
          (which had `allow-unauthenticated: true` set since 2026-05-12)
          went 403-only after a routine main-branch deploy — the 4th IAM
          strip incident in this codebase. The re-bind step below makes
          the binding genuinely sticky across all canary lifecycle paths.

          If false, passes `--no-allow-unauthenticated`, which STRIPS any
          existing public binding — keep this default for private services.
          Set true for any public B2C/marketing service.
          See incident memory `incident-cloud-run-remove-tags-strips-iam-2026-05-08.md`.
        type: boolean
        default: false
      vpc-connector:
        description: 'Serverless VPC Access connector name (omit if not using VPC).'
        type: string
        default: ''
      vpc-egress:
        description: 'VPC egress mode: all-traffic | private-ranges-only. Requires vpc-connector.'
        type: string
        default: ''
      cloudsql-instances:
        description: 'Comma-separated Cloud SQL instance connection names for --add-cloudsql-instances.'
        type: string
        default: ''
      port:
        description: 'Container port (defaults to 8080 in Cloud Run if omitted).'
        type: string
        default: ''
      verify-signature:
        description: |
          Verify image with Cosign keyless OIDC before deploying. Default true.
          Set false when the image was built outside `reusable-build-sign.yml`
          (e.g. plain `gcloud builds submit` with no signing step). Tech debt:
          consumers using Cloud Build should add a sign step and flip this back
          to true.
        type: boolean
        default: true
      feedback-hub-url:
        description: 'Base URL of Feedback Hub API'
        type: string
        default: 'https://gundo-content-engine-xlpp333cua-uc.a.run.app'
    secrets:
      FEEDBACK_HUB_API_KEY:
        description: 'API key for Feedback Hub /api/devops endpoints'
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: Canary deploy
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      revision: ${{ steps.deploy-new.outputs.revision }}
    steps:
      - name: Checkout gundo-workflows scripts
        uses: actions/checkout@v5
        with:
          repository: jplannnou/gundo-workflows
          ref: v1
          path: .gundo-workflows

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cosign
        run: |
          curl -L https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      - name: Login cosign to Artifact Registry
        run: |
          gcloud auth print-access-token \
            | cosign login "${{ inputs.gcp-region }}-docker.pkg.dev" \
                -u oauth2accesstoken --password-stdin

      - name: Verify image signature (Cosign)
        if: inputs.verify-signature == true
        run: |
          COSIGN_EXPERIMENTAL=1 cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ inputs.image }}"

      - name: Report deploy started
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="building" \
            --author="${{ github.actor }}"

      - name: Build deploy flags
        id: flags
        env:
          ENV_VARS: ${{ inputs.env-vars }}
          SECRETS_MAPPING: ${{ inputs.secrets-mapping }}
          ENV_VARS_SEP: ${{ inputs.env-vars-separator }}
        run: |
          # Emit each flag on its own line. The deploy step reads via mapfile
          # and expands as "${flags[@]}", so bash never re-parses argv tokens.
          # This is safe for env-var values containing |, ||, $, spaces, or
          # any other shell metacharacter — discovered 2026-05-08 when Engine
          # PR #48 (--set-env-vars=...SELLER_NOTIFICATION_PHONES=p1|p2...) hit
          # exit 127 because bash interpreted `|` as a pipe inside the raw
          # interpolation `${{ steps.flags.outputs.flags }}`.
          FLAGS_FILE="$RUNNER_TEMP/deploy-flags.txt"
          {
            echo "--image=${{ inputs.image }}"
            echo "--region=${{ inputs.gcp-region }}"
            echo "--project=${{ inputs.gcp-project }}"
            echo "--service-account=${{ inputs.runtime-service-account }}"
            echo "--memory=${{ inputs.memory }}"
            echo "--cpu=${{ inputs.cpu }}"
            echo "--concurrency=${{ inputs.concurrency }}"
            echo "--timeout=${{ inputs.timeout }}"
            echo "--min-instances=${{ inputs.min-instances }}"
            echo "--max-instances=${{ inputs.max-instances }}"

            # Auth posture (default secure: --no-allow-unauthenticated)
            if [ "${{ inputs.allow-unauthenticated }}" = "true" ]; then
              echo "--allow-unauthenticated"
            else
              echo "--no-allow-unauthenticated"
            fi

            # Optional perf flags
            if [ "${{ inputs.cpu-boost }}" = "true" ]; then
              echo "--cpu-boost"
            fi
            if [ "${{ inputs.session-affinity }}" = "true" ]; then
              echo "--session-affinity"
            fi

            # Optional networking
            if [ -n "${{ inputs.vpc-connector }}" ]; then
              echo "--vpc-connector=${{ inputs.vpc-connector }}"
            fi
            if [ -n "${{ inputs.vpc-egress }}" ]; then
              echo "--vpc-egress=${{ inputs.vpc-egress }}"
            fi

            # Optional Cloud SQL connections
            if [ -n "${{ inputs.cloudsql-instances }}" ]; then
              echo "--add-cloudsql-instances=${{ inputs.cloudsql-instances }}"
            fi

            # Optional container port (Cloud Run defaults to 8080 when omitted)
            if [ -n "${{ inputs.port }}" ]; then
              echo "--port=${{ inputs.port }}"
            fi

            # Env vars and secrets — only emit if non-empty. When the separator
            # is not the default `,`, prepend gcloud's `^<sep>^` sentinel so
            # commas inside values don't split the list (e.g. ALLOWED_ORIGINS).
            if [ -n "$ENV_VARS" ]; then
              if [ "$ENV_VARS_SEP" = "," ]; then
                echo "--set-env-vars=$ENV_VARS"
              else
                echo "--set-env-vars=^${ENV_VARS_SEP}^${ENV_VARS}"
              fi
            fi
            if [ -n "$SECRETS_MAPPING" ]; then
              if [ "$ENV_VARS_SEP" = "," ]; then
                echo "--set-secrets=$SECRETS_MAPPING"
              else
                echo "--set-secrets=^${ENV_VARS_SEP}^${SECRETS_MAPPING}"
              fi
            fi
          } > "$FLAGS_FILE"

          echo "flags-file=$FLAGS_FILE" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -l < "$FLAGS_FILE") deploy flags → $FLAGS_FILE"

      - name: Deploy new revision (no traffic)
        id: deploy-new
        if: inputs.skip-canary == false
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REVISION_TAG="canary-$SHORT_SHA"

          # Read flags as array — preserves each token without re-parsing,
          # so values containing |, ||, $, etc. are passed verbatim to gcloud.
          mapfile -t flags < "${{ steps.flags.outputs.flags-file }}"

          gcloud run deploy "${{ inputs.service }}" \
            "${flags[@]}" \
            --no-traffic \
            --tag="$REVISION_TAG"

          # Resolve the new canary revision by tag — do NOT use traffic[0],
          # which after `--no-traffic --tag=canary-X` points to the PREVIOUS
          # revision (still serving 100%) rather than the freshly created one.
          # Discovered 2026-05-08 on the Radar pilot (PR #42): the workflow
          # captured the old revision and "promoted" it to 100% (effective no-op),
          # leaving the new revision orphaned at 0% with the canary tag stripped
          # by the post-promote cleanup. Tag-based lookup matches what the
          # Radar/Engine/Feedback inline ci.yml jobs always did.
          for i in $(seq 1 5); do
            REVISION=$(gcloud run services describe ${{ inputs.service }} \
              --region=${{ inputs.gcp-region }} \
              --project=${{ inputs.gcp-project }} \
              --format=json | jq -r --arg tag "$REVISION_TAG" \
              '.status.traffic[] | select(.tag == $tag) | .revisionName' | head -1)
            if [ -n "$REVISION" ] && [ "$REVISION" != "null" ]; then break; fi
            echo "  [$i] tag '$REVISION_TAG' not yet visible, retrying in 3s..."
            sleep 3
          done

          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "::error::Could not resolve revision by tag '$REVISION_TAG' after 5 retries"
            exit 1
          fi
          echo "Canary revision: $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$REVISION_TAG" >> "$GITHUB_OUTPUT"

      - name: Shift traffic to canary
        if: inputs.skip-canary == false
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-tags=${{ steps.deploy-new.outputs.tag }}=${{ inputs.canary-percent }}

      - name: Report canary started
        if: inputs.skip-canary == false
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="canary" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --traffic-percent=${{ inputs.canary-percent }}

      - name: Watch canary SLO
        id: watch
        if: inputs.skip-canary == false
        continue-on-error: true
        run: |
          bash .gundo-workflows/scripts/canary-watch.sh \
            --service="${{ inputs.service }}" \
            --project="${{ inputs.gcp-project }}" \
            --region="${{ inputs.gcp-region }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --duration=${{ inputs.canary-duration-seconds }} \
            --max-error-rate=${{ inputs.max-error-rate }} \
            --max-p95-ms=${{ inputs.max-p95-latency-ms }}

      - name: Promote canary to 100%
        id: promote
        if: inputs.skip-canary == false && steps.watch.outcome == 'success'
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-revisions=${{ steps.deploy-new.outputs.revision }}=100 \
            --remove-tags=${{ steps.deploy-new.outputs.tag }}

      - name: Rollback
        id: rollback
        if: inputs.skip-canary == false && steps.watch.outcome == 'failure'
        run: |
          STABLE_REVISION=$(gcloud run revisions list \
            --service=${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --filter='metadata.labels.stable=true AND NOT metadata.name=${{ steps.deploy-new.outputs.revision }}' \
            --format='value(metadata.name)' \
            --limit=1)

          if [ -z "$STABLE_REVISION" ]; then
            echo "::error::No stable revision found for rollback"
            exit 1
          fi

          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-revisions=$STABLE_REVISION=100 \
            --remove-tags=${{ steps.deploy-new.outputs.tag }}

          echo "Rolled back to $STABLE_REVISION"
          echo "stable-revision=$STABLE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy direct (skip canary, emergency)
        if: inputs.skip-canary == true
        run: |
          mapfile -t flags < "${{ steps.flags.outputs.flags-file }}"
          gcloud run deploy "${{ inputs.service }}" "${flags[@]}"

      # Belt-and-braces: if the job is cancelled mid-flight (concurrency
      # cancel-in-progress, manual cancel, runner timeout) the promote and
      # rollback steps never execute, leaving canary-<sha> pinned to the new
      # revision and billing it 24/7. This step runs on every terminal state
      # — success, failure, cancellation — and untags whatever the deploy
      # step created. Idempotent: --remove-tags on a missing tag is a no-op.
      - name: Cleanup canary tag (always)
        if: always() && steps.deploy-new.outputs.tag != ''
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --remove-tags=${{ steps.deploy-new.outputs.tag }} \
            --quiet || true

      # Re-bind allUsers/run.invoker at SERVICE level after every
      # `update-traffic` call. The promote step (line ~369) and the cleanup
      # step above both invoke `gcloud run services update-traffic ...
      # --remove-tags=...`, which silently drops the public IAM binding even
      # when the initial `gcloud run deploy --allow-unauthenticated` set it
      # atomically. Without this re-bind the service goes 403-only ~2-3
      # minutes after deploy completes, breaking every public B2C surface
      # until someone notices and runs `add-iam-policy-binding` by hand.
      #
      # We re-apply on `always()` so it runs after promote AND after rollback
      # AND after cancellation. Idempotent: if the binding already exists,
      # gcloud returns success without modifying the policy. Skipped entirely
      # when allow-unauthenticated is false (private services keep their
      # existing posture untouched).
      #
      # See: incident-cloud-run-remove-tags-strips-iam-2026-05-08.md and the
      # 4th recurrence on gundo-ecommerce-ui 2026-05-21.
      - name: Re-bind public access (always, post-update-traffic)
        if: always() && inputs.allow-unauthenticated == true
        run: |
          gcloud run services add-iam-policy-binding ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      - name: Determine outcome
        id: outcome
        if: always()
        run: |
          if [ "${{ inputs.skip-canary }}" = "true" ]; then
            echo "status=promoted" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.watch.outcome }}" = "success" ]; then
            echo "status=promoted" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "status=rolled_back" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report final status
        if: always()
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="${{ steps.outcome.outputs.status }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}"

      - name: Fail job if rolled back or failed
        if: steps.outcome.outputs.status != 'promoted'
        run: |
          echo "::error::Deploy ended with status ${{ steps.outcome.outputs.status }}"
          exit 1
