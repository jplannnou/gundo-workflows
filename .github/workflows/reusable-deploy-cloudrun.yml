name: Reusable Cloud Run Deploy (canary + auto-rollback)

# ------------------------------------------------------------------------------
# Deploy a signed, SBOM-attested Docker image to Cloud Run with canary
# strategy:
#   0. Sweep orphan canary-* tags left by earlier runs, then capture the
#      rollback target: the revision serving the most traffic right now
#      (see the `Capture rollback target` step for why it must happen
#      before the deploy, and why no label is written)
#   1. Deploy new revision with --no-traffic and tag=canary-<sha>
#   2. Shift 10% traffic to canary
#   3. Watch SLO (error rate, p95 latency) for `canary-duration` seconds
#   4. If SLO holds: promote to 100% + untag the canary
#   5. If SLO breaks: rollback to the revision captured in step 0
#
# Reports deployment lifecycle to Feedback Hub (/api/devops/deployments).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label del runner donde corre el job de deploy. Default ubuntu-latest
          (GitHub-hosted). Los repos del org pasan `gundo-local` para usar los
          self-hosted runners (migración 2026-07 por cuota de minutos).
        type: string
        default: 'ubuntu-latest'
      gcp-project:
        type: string
        required: true
      gcp-region:
        type: string
        default: 'us-central1'
      service:
        description: 'Cloud Run service name'
        type: string
        required: true
      image:
        description: 'Full image URI (from reusable-build-sign outputs)'
        type: string
        required: true
      workload-identity-provider:
        type: string
        required: true
      service-account:
        description: 'SA used by the deploy job (NOT the Cloud Run runtime SA)'
        type: string
        required: true
      runtime-service-account:
        description: 'SA that the Cloud Run service runs as'
        type: string
        required: true
      secrets-mapping:
        description: 'MOUNT=SECRET:VERSION pairs for --set-secrets, separated by `env-vars-separator`'
        type: string
        default: ''
      env-vars:
        description: 'KEY=VALUE pairs for --set-env-vars, separated by `env-vars-separator`'
        type: string
        default: ''
      env-vars-separator:
        description: |
          Custom delimiter for env-vars / secrets-mapping. Default `,`. Pass `||`
          (or any non-comma char) when values contain commas (URLs, lists). The
          step prepends the gcloud sentinel `^<sep>^` automatically.
        type: string
        default: ','
      memory:
        type: string
        default: '1Gi'
      cpu:
        type: string
        default: '1'
      concurrency:
        type: number
        default: 80
      timeout:
        type: string
        default: '300'
      min-instances:
        type: number
        default: 0
      max-instances:
        type: number
        default: 10
      canary-percent:
        description: 'Traffic percentage sent to canary during watch'
        type: number
        default: 10
      canary-duration-seconds:
        description: 'How long to watch the canary before promoting'
        type: number
        default: 300
      max-error-rate:
        description: 'Error rate (0-1) that triggers rollback'
        type: number
        default: 0.01
      max-p95-latency-ms:
        description: 'p95 latency in ms that triggers rollback'
        type: number
        default: 1500
      skip-canary:
        description: 'If true, deploy directly to 100% (emergency use only)'
        type: boolean
        default: false
      cpu-boost:
        description: 'Enable CPU boost on startup (faster cold starts)'
        type: boolean
        default: false
      session-affinity:
        description: 'Enable session affinity (sticky sessions)'
        type: boolean
        default: false
      allow-unauthenticated:
        description: |
          If true, passes `--allow-unauthenticated` to `gcloud run deploy` AND
          re-binds `allUsers/run.invoker` at the SERVICE level after every
          `update-traffic` call (promote, rollback, cleanup). The initial
          `gcloud run deploy --allow-unauthenticated` is NOT enough on its
          own: the subsequent `update-traffic --remove-tags=canary-X` call
          re-serializes the service config and silently drops the public
          binding. We discovered this 2026-05-21 when gundo-ecommerce-ui
          (which had `allow-unauthenticated: true` set since 2026-05-12)
          went 403-only after a routine main-branch deploy — the 4th IAM
          strip incident in this codebase. The re-bind step below makes
          the binding genuinely sticky across all canary lifecycle paths.

          If false, passes `--no-allow-unauthenticated`, which STRIPS any
          existing public binding — keep this default for private services.
          Set true for any public B2C/marketing service.
          See incident memory `incident-cloud-run-remove-tags-strips-iam-2026-05-08.md`.
        type: boolean
        default: false
      vpc-connector:
        description: 'Serverless VPC Access connector name (omit if not using VPC).'
        type: string
        default: ''
      vpc-egress:
        description: 'VPC egress mode: all-traffic | private-ranges-only. Requires vpc-connector.'
        type: string
        default: ''
      cloudsql-instances:
        description: 'Comma-separated Cloud SQL instance connection names for --add-cloudsql-instances.'
        type: string
        default: ''
      port:
        description: 'Container port (defaults to 8080 in Cloud Run if omitted).'
        type: string
        default: ''
      verify-signature:
        description: |
          Verify image with Cosign keyless OIDC before deploying. Default true.
          Set false when the image was built outside `reusable-build-sign.yml`
          (e.g. plain `gcloud builds submit` with no signing step). Tech debt:
          consumers using Cloud Build should add a sign step and flip this back
          to true.
        type: boolean
        default: true
      feedback-hub-url:
        description: 'Base URL of Feedback Hub API'
        type: string
        default: 'https://gundo-content-engine-xlpp333cua-uc.a.run.app'
    secrets:
      FEEDBACK_HUB_API_KEY:
        description: 'API key for Feedback Hub /api/devops endpoints'
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    name: Canary deploy
    runs-on: ${{ inputs.runner }}
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      revision: ${{ steps.deploy-new.outputs.revision }}
    steps:
      - name: Checkout gundo-workflows scripts
        uses: actions/checkout@v5
        with:
          repository: jplannnou/gundo-workflows
          ref: v1
          path: .gundo-workflows

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 🔴 En una ruta ESCRIBIBLE por el runner, no en /usr/local/bin.
      #
      # En los runners hospedados de GitHub el usuario es sudoer sin contraseña
      # y escribir ahí funcionaba. En los self-hosted del org —WSL2, desde el
      # 21-jul— no lo es: `curl -o /usr/local/bin/cosign` devuelve 23 (write
      # error) y tumba el deploy ENTERO después de haber construido y subido la
      # imagen. Todos los deploys de gundo-ecommerce-ui fallaron así desde el
      # 12-ago, y el error real quedaba enterrado bajo un warning de curl.
      #
      # $RUNNER_TEMP siempre pertenece al runner, en las dos clases de máquina.
      - name: Install Cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o "$RUNNER_TEMP/bin/cosign"
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cosign" version

      - name: Login cosign to Artifact Registry
        run: |
          gcloud auth print-access-token \
            | cosign login "${{ inputs.gcp-region }}-docker.pkg.dev" \
                -u oauth2accesstoken --password-stdin

      - name: Verify image signature (Cosign)
        if: inputs.verify-signature == true
        run: |
          COSIGN_EXPERIMENTAL=1 cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ inputs.image }}"

      - name: Report deploy started
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="building" \
            --author="${{ github.actor }}"

      - name: Build deploy flags
        id: flags
        env:
          ENV_VARS: ${{ inputs.env-vars }}
          SECRETS_MAPPING: ${{ inputs.secrets-mapping }}
          ENV_VARS_SEP: ${{ inputs.env-vars-separator }}
        run: |
          # Emit each flag on its own line. The deploy step reads via mapfile
          # and expands as "${flags[@]}", so bash never re-parses argv tokens.
          # This is safe for env-var values containing |, ||, $, spaces, or
          # any other shell metacharacter — discovered 2026-05-08 when Engine
          # PR #48 (--set-env-vars=...SELLER_NOTIFICATION_PHONES=p1|p2...) hit
          # exit 127 because bash interpreted `|` as a pipe inside the raw
          # interpolation of the old `steps.flags.outputs.flags` output.
          # (Deliberately written as plain text, not as a GitHub expression:
          # it is a historical reference to an output that no longer exists,
          # and actionlint resolves expressions even inside shell comments.)
          FLAGS_FILE="$RUNNER_TEMP/deploy-flags.txt"
          {
            echo "--image=${{ inputs.image }}"
            echo "--region=${{ inputs.gcp-region }}"
            echo "--project=${{ inputs.gcp-project }}"
            echo "--service-account=${{ inputs.runtime-service-account }}"
            echo "--memory=${{ inputs.memory }}"
            echo "--cpu=${{ inputs.cpu }}"
            echo "--concurrency=${{ inputs.concurrency }}"
            echo "--timeout=${{ inputs.timeout }}"
            echo "--min-instances=${{ inputs.min-instances }}"
            echo "--max-instances=${{ inputs.max-instances }}"

            # Auth posture (default secure: --no-allow-unauthenticated)
            if [ "${{ inputs.allow-unauthenticated }}" = "true" ]; then
              echo "--allow-unauthenticated"
            else
              echo "--no-allow-unauthenticated"
            fi

            # Optional perf flags
            if [ "${{ inputs.cpu-boost }}" = "true" ]; then
              echo "--cpu-boost"
            fi
            if [ "${{ inputs.session-affinity }}" = "true" ]; then
              echo "--session-affinity"
            fi

            # Optional networking
            if [ -n "${{ inputs.vpc-connector }}" ]; then
              echo "--vpc-connector=${{ inputs.vpc-connector }}"
            fi
            if [ -n "${{ inputs.vpc-egress }}" ]; then
              echo "--vpc-egress=${{ inputs.vpc-egress }}"
            fi

            # Optional Cloud SQL connections
            if [ -n "${{ inputs.cloudsql-instances }}" ]; then
              echo "--add-cloudsql-instances=${{ inputs.cloudsql-instances }}"
            fi

            # Optional container port (Cloud Run defaults to 8080 when omitted)
            if [ -n "${{ inputs.port }}" ]; then
              echo "--port=${{ inputs.port }}"
            fi

            # Env vars and secrets — only emit if non-empty. When the separator
            # is not the default `,`, prepend gcloud's `^<sep>^` sentinel so
            # commas inside values don't split the list (e.g. ALLOWED_ORIGINS).
            if [ -n "$ENV_VARS" ]; then
              if [ "$ENV_VARS_SEP" = "," ]; then
                echo "--set-env-vars=$ENV_VARS"
              else
                echo "--set-env-vars=^${ENV_VARS_SEP}^${ENV_VARS}"
              fi
            fi
            if [ -n "$SECRETS_MAPPING" ]; then
              if [ "$ENV_VARS_SEP" = "," ]; then
                echo "--set-secrets=$SECRETS_MAPPING"
              else
                echo "--set-secrets=^${ENV_VARS_SEP}^${SECRETS_MAPPING}"
              fi
            fi
          } > "$FLAGS_FILE"

          echo "flags-file=$FLAGS_FILE" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -l < "$FLAGS_FILE") deploy flags → $FLAGS_FILE"

      # Compute the tag before invoking gcloud. If `gcloud run deploy` creates
      # an invalid revision and exits non-zero, outputs written after that
      # command never exist. The cleanup step then cannot remove the poisoned
      # tag and every later deploy fails while Cloud Run tries to route it.
      - name: Prepare canary metadata
        id: canary-meta
        if: inputs.skip-canary == false
        run: echo "tag=canary-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Barrido de tags `canary-*` HUÉRFANOS que dejaron runs ANTERIORES.
      #
      # Toda la limpieza previa de este workflow es AUTOLIMPIEZA: la promoción,
      # el rollback y el step `Cleanup canary tag (always)` retiran únicamente
      # el `canary-<sha>` de SU propio run. Eso cubre los finales ordenados,
      # pero hay caminos en los que el job deja de existir sin ejecutar nada,
      # ni siquiera los `always()`: el runner self-hosted se apaga o reinicia
      # (los `gundo-local` viven en una workstation), o el job se cancela por
      # timeout mientras `gcloud run deploy` está bloqueado esperando al plano
      # de control.
      #
      # Ese último caso no es teórico: las 11 revisiones huérfanas de genie-api
      # del 10-11 de julio de 2026 tardaron entre 3h30m y 9h52m en aprovisionar
      # (`Deploying revision succeeded in 9h52m14.38s`). El tag ya estaba
      # escrito en `spec.traffic` desde el primer segundo; el job murió mucho
      # antes de poder retirarlo.
      #
      # Y como ningún run miraba nunca los tags de otros runs, un solo escape
      # se volvía permanente. Con este barrido, un escape se cura en el
      # despliegue siguiente. El script solo retira tags al 0% de tráfico y con
      # más de 60 minutos de vida, así que nunca puede tocar un canary en
      # vuelo. Nunca hace fallar el deploy: es higiene, no una puerta.
      #
      # Se hace ANTES de crear el tag de este run, y a propósito NO se pasa
      # `--keep-tag`: si un intento anterior del MISMO sha dejó su tag colgado,
      # queremos retirarlo antes de volver a crearlo, no conservarlo.
      #
      # También corre en el camino `skip-canary`: un deploy de emergencia es
      # justo cuando más conviene no arrastrar basura en la tabla de tráfico.
      #
      # El `--remove-tags` que hace el script se lleva por delante el binding
      # público, igual que el resto de llamadas a `update-traffic`. Lo recoge
      # el step `Re-bind public access (always, post-update-traffic)` del final.
      - name: Sweep orphan canary tags
        continue-on-error: true
        run: |
          bash .gundo-workflows/scripts/sweep-canary-tags.sh \
            --service="${{ inputs.service }}" \
            --project="${{ inputs.gcp-project }}" \
            --region="${{ inputs.gcp-region }}" \
            --min-age-minutes=60 \
            --apply

      # Captura el destino del rollback ANTES de desplegar, leyendo qué
      # revisión sirve tráfico ahora mismo.
      #
      # Antes, el rollback buscaba su destino por `metadata.labels.stable=true`.
      # Nadie ponía nunca esa etiqueta: la escritura se eliminó en abril
      # (421d9fde) porque usaba `gcloud run revisions update`, que no es un
      # subcomando válido — las revisiones de Cloud Run son INMUTABLES y la
      # Admin API no expone forma de modificar sus labels. Por eso no se
      # reintroduce la etiqueta: no es un olvido, es imposible por diseño.
      # Medido en vivo (2026-08-15): cero revisiones la llevan en ningún
      # servicio, así que el rollback moría con "No stable revision found"
      # y el tráfico se quedaba en la revisión mala.
      #
      # Se captura ANTES del deploy y no en el momento del rollback porque
      # para entonces el canary ya se está llevando su porcentaje y la foto
      # está contaminada. Y se captura fuera del step de promoción porque
      # `canary-watch.sh` aborta con exit 1 A MITAD de la ventana en cuanto
      # acumula 2 ventanas seguidas fuera de umbral (ver el bloque
      # MAX_BREACHES del script): en ese camino la promoción nunca llega a
      # ejecutarse, así que el destino no puede depender de nada que ella
      # hubiera dejado escrito.
      #
      # Se elige la revisión con MÁS tráfico, no la que tenga exactamente
      # 100%: un run abortado a mitad de canary puede haber dejado el reparto
      # partido (p. ej. 90/10) y en ese caso el destino correcto es el 90%.
      # Se excluyen las entradas con tag, que son canarios viejos colgados —
      # genie-api acumula 11 en vivo, y son justo las primeras de la lista.
      - name: Capture rollback target
        id: rollback-target
        if: inputs.skip-canary == false
        run: |
          # Un servicio que aún no existe hace fallar a `describe`. Eso no es
          # un error: es el primer despliegue absoluto. Se trata como "sin
          # destino" y se decide más abajo, en el step de Rollback.
          SERVICE_JSON=$(gcloud run services describe ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --format=json 2>/dev/null) || SERVICE_JSON=''

          if [ -n "$SERVICE_JSON" ]; then
            ROLLBACK_TARGET=$(jq -r '
              [ .status.traffic[]?
                | select(.tag == null)
                | select((.percent // 0) > 0)
              ]
              | sort_by(.percent)
              | last
              | .revisionName // ""
            ' <<< "$SERVICE_JSON")
          else
            ROLLBACK_TARGET=''
          fi

          if [ -z "$ROLLBACK_TARGET" ] || [ "$ROLLBACK_TARGET" = "null" ]; then
            ROLLBACK_TARGET=''
            echo "::warning::Ninguna revisión previa sirve tráfico en '${{ inputs.service }}'. Si el canary rompe el SLO, el rollback no tendrá destino y fallará de forma explícita."
          else
            echo "Destino de rollback capturado: $ROLLBACK_TARGET"
          fi

          echo "revision=$ROLLBACK_TARGET" >> "$GITHUB_OUTPUT"

      # `timeout-minutes` acota el bloqueo del plano de control. `gcloud run
      # deploy` espera a que la revisión esté lista y no tiene tope propio: el
      # 10-11 de julio de 2026 se quedó esperando entre 3h30m y 9h52m por
      # revisión en europe-west1, y el job se agotó ahí dentro con el tag ya
      # escrito en `spec.traffic`. Un despliegue sano tarda 1-4 minutos.
      #
      # Cortar aquí a los 30 no cancela la operación del lado de Cloud Run —la
      # revisión acabará estando lista igualmente— pero devuelve el control al
      # job MIENTRAS EL RUNNER SIGUE VIVO, que es la condición para que el step
      # `Cleanup canary tag (always)` llegue a ejecutarse. Si aun así la
      # limpieza no lo consigue, el barrido del próximo despliegue lo recoge.
      - name: Deploy new revision (no traffic)
        id: deploy-new
        if: inputs.skip-canary == false
        timeout-minutes: 30
        run: |
          REVISION_TAG="${{ steps.canary-meta.outputs.tag }}"

          # Read flags as array — preserves each token without re-parsing,
          # so values containing |, ||, $, etc. are passed verbatim to gcloud.
          mapfile -t flags < "${{ steps.flags.outputs.flags-file }}"

          gcloud run deploy "${{ inputs.service }}" \
            "${flags[@]}" \
            --no-traffic \
            --tag="$REVISION_TAG"

          # Resolve the new canary revision by tag — do NOT use traffic[0],
          # which after `--no-traffic --tag=canary-X` points to the PREVIOUS
          # revision (still serving 100%) rather than the freshly created one.
          # Discovered 2026-05-08 on the Radar pilot (PR #42): the workflow
          # captured the old revision and "promoted" it to 100% (effective no-op),
          # leaving the new revision orphaned at 0% with the canary tag stripped
          # by the post-promote cleanup. Tag-based lookup matches what the
          # Radar/Engine/Feedback inline ci.yml jobs always did.
          for i in $(seq 1 5); do
            REVISION=$(gcloud run services describe ${{ inputs.service }} \
              --region=${{ inputs.gcp-region }} \
              --project=${{ inputs.gcp-project }} \
              --format=json | jq -r --arg tag "$REVISION_TAG" \
              '.status.traffic[] | select(.tag == $tag) | .revisionName' | head -1)
            if [ -n "$REVISION" ] && [ "$REVISION" != "null" ]; then break; fi
            echo "  [$i] tag '$REVISION_TAG' not yet visible, retrying in 3s..."
            sleep 3
          done

          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "::error::Could not resolve revision by tag '$REVISION_TAG' after 5 retries"
            exit 1
          fi
          echo "Canary revision: $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$REVISION_TAG" >> "$GITHUB_OUTPUT"

      - name: Shift traffic to canary
        if: inputs.skip-canary == false
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-tags=${{ steps.deploy-new.outputs.tag }}=${{ inputs.canary-percent }}

      - name: Report canary started
        if: inputs.skip-canary == false
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="canary" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --traffic-percent=${{ inputs.canary-percent }}

      - name: Watch canary SLO
        id: watch
        if: inputs.skip-canary == false
        continue-on-error: true
        run: |
          bash .gundo-workflows/scripts/canary-watch.sh \
            --service="${{ inputs.service }}" \
            --project="${{ inputs.gcp-project }}" \
            --region="${{ inputs.gcp-region }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}" \
            --duration=${{ inputs.canary-duration-seconds }} \
            --max-error-rate=${{ inputs.max-error-rate }} \
            --max-p95-ms=${{ inputs.max-p95-latency-ms }}

      - name: Promote canary to 100%
        id: promote
        if: inputs.skip-canary == false && steps.watch.outcome == 'success'
        run: |
          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-revisions=${{ steps.deploy-new.outputs.revision }}=100 \
            --remove-tags=${{ steps.deploy-new.outputs.tag }}

      - name: Rollback
        id: rollback
        if: inputs.skip-canary == false && steps.watch.outcome == 'failure'
        run: |
          ROLLBACK_TARGET="${{ steps.rollback-target.outputs.revision }}"

          # Primer despliegue de un servicio nuevo que además rompe el SLO:
          # no hay ninguna revisión previa que haya servido tráfico, así que
          # no hay destino al que volver. Se falla con un mensaje accionable
          # en vez de caer a "la revisión anterior por orden de creación":
          # en un servicio recién creado esa revisión nunca sirvió tráfico
          # (puede venir de un deploy abortado o de otra configuración), y
          # mandarle el 100% sería una apuesta a ciegas — peor que parar.
          # El step de cleanup posterior corre igualmente (`always()`) y
          # retira el tag del canary, así que no queda tag colgado.
          if [ -z "$ROLLBACK_TARGET" ]; then
            echo "::error::El canary rompió el SLO pero no hay revisión previa sirviendo tráfico en '${{ inputs.service }}', así que no hay destino de rollback. Revisa la revisión '${{ steps.deploy-new.outputs.revision }}' a mano y despliega una versión sana."
            exit 1
          fi

          gcloud run services update-traffic ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --to-revisions="$ROLLBACK_TARGET=100" \
            --remove-tags=${{ steps.deploy-new.outputs.tag }}

          echo "Rolled back to $ROLLBACK_TARGET"
          echo "rollback-revision=$ROLLBACK_TARGET" >> "$GITHUB_OUTPUT"

      - name: Deploy direct (skip canary, emergency)
        id: deploy-direct
        if: inputs.skip-canary == true
        run: |
          mapfile -t flags < "${{ steps.flags.outputs.flags-file }}"
          gcloud run deploy "${{ inputs.service }}" "${flags[@]}"

      # Belt-and-braces: if the job is cancelled mid-flight (concurrency
      # cancel-in-progress, manual cancel, runner timeout) the promote and
      # rollback steps never execute, leaving canary-<sha> pinned to the new
      # revision and billing it 24/7. This step runs on every terminal state
      # — success, failure, cancellation — and untags whatever the deploy
      # step created. Idempotent: --remove-tags on a missing tag is a no-op.
      - name: Cleanup canary tag (always)
        if: always() && inputs.skip-canary == false && steps.canary-meta.outputs.tag != ''
        run: |
          TAG="${{ steps.canary-meta.outputs.tag }}"

          tag_is_absent() {
            local service_json
            service_json=$(gcloud run services describe ${{ inputs.service }} \
              --region=${{ inputs.gcp-region }} \
              --project=${{ inputs.gcp-project }} \
              --format=json) || return 2

            if jq -e --arg tag "$TAG" \
              '.spec.traffic[]? | select(.tag == $tag)' \
              <<< "$service_json" >/dev/null; then
              return 1
            fi
            return 0
          }

          if tag_is_absent; then
            echo "Canary tag '$TAG' is already absent"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Removing canary tag '$TAG' (attempt $attempt/3)"
            gcloud run services update-traffic ${{ inputs.service }} \
              --region=${{ inputs.gcp-region }} \
              --project=${{ inputs.gcp-project }} \
              --remove-tags="$TAG" \
              --quiet || true

            if tag_is_absent; then
              echo "Verified: canary tag '$TAG' is absent"
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::error::Canary tag '$TAG' is still present after 3 cleanup attempts"
          exit 1

      # Re-bind allUsers/run.invoker at SERVICE level after every
      # `update-traffic` call. The promote step (line ~369) and the cleanup
      # step above both invoke `gcloud run services update-traffic ...
      # --remove-tags=...`, which silently drops the public IAM binding even
      # when the initial `gcloud run deploy --allow-unauthenticated` set it
      # atomically. Without this re-bind the service goes 403-only ~2-3
      # minutes after deploy completes, breaking every public B2C surface
      # until someone notices and runs `add-iam-policy-binding` by hand.
      #
      # We re-apply on `always()` so it runs after promote AND after rollback
      # AND after cancellation. Idempotent: if the binding already exists,
      # gcloud returns success without modifying the policy. Skipped entirely
      # when allow-unauthenticated is false (private services keep their
      # existing posture untouched).
      #
      # See: incident-cloud-run-remove-tags-strips-iam-2026-05-08.md and the
      # 4th recurrence on gundo-ecommerce-ui 2026-05-21.
      - name: Re-bind public access (always, post-update-traffic)
        if: always() && inputs.allow-unauthenticated == true
        run: |
          gcloud run services add-iam-policy-binding ${{ inputs.service }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      # `promoted` se decide por el resultado de la PROMOCIÓN, no por el del
      # watch. Antes se miraba `steps.watch.outcome`: si el watch pasaba pero
      # el `update-traffic` de la promoción fallaba, el tráfico se quedaba al
      # `canary-percent` (10%) en la revisión nueva y el deploy se reportaba
      # igualmente como `promoted` a Feedback Hub, además de saltarse el step
      # final de fallo — que solo salta si el estado NO es `promoted`. Mismo
      # razonamiento para el camino `skip-canary`, que reportaba `promoted`
      # aunque el `gcloud run deploy` directo hubiera fallado.
      - name: Determine outcome
        id: outcome
        if: always()
        run: |
          if [ "${{ inputs.skip-canary }}" = "true" ]; then
            if [ "${{ steps.deploy-direct.outcome }}" = "success" ]; then
              echo "status=promoted" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ steps.promote.outcome }}" = "success" ]; then
            echo "status=promoted" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "status=rolled_back" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Report final status
        if: always()
        env:
          FEEDBACK_HUB_URL: ${{ inputs.feedback-hub-url }}
          FEEDBACK_HUB_API_KEY: ${{ secrets.FEEDBACK_HUB_API_KEY }}
        run: |
          bash .gundo-workflows/scripts/report-deployment.sh \
            --project="${{ inputs.service }}" \
            --commit="${{ github.sha }}" \
            --status="${{ steps.outcome.outputs.status }}" \
            --revision="${{ steps.deploy-new.outputs.revision }}"

      - name: Fail job if rolled back or failed
        if: steps.outcome.outputs.status != 'promoted'
        run: |
          echo "::error::Deploy ended with status ${{ steps.outcome.outputs.status }}"
          exit 1
