name: Reusable NPM Publish (semantic-release)

# ------------------------------------------------------------------------------
# Publish a package to GitHub Packages (npm.pkg.github.com) using
# semantic-release on push to main. Conventional Commits drive the version
# bump:
#   feat:  -> minor
#   fix:   -> patch
#   feat!: -> major (BREAKING CHANGE)
#
# Used by @gundo/ui and @gundo/feedback-sdk. After a release, callers can
# trigger a propagate job that opens PRs in consumer repos bumping the
# dependency.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label del runner self-hosted: `gundo-local` en los repos del org,
          `jp-local` en los privados personales. Sin default a proposito: un
          default alojado convertia cada olvido en minutos de pago silenciosos.
        type: string
        required: true
      node-version:
        type: string
        default: '22'
      node-version-file:
        description: 'Archivo con la version de Node, relativo a la raiz del repo. Si existe, gana sobre node-version; vacio para no leerlo.'
        type: string
        default: '.nvmrc'
      pnpm-version:
        type: string
        default: '10.30.1'
      working-directory:
        type: string
        default: '.'
      build-command:
        type: string
        default: 'pnpm install --frozen-lockfile && pnpm build'
    secrets:
      GH_PACKAGES_TOKEN:
        description: 'Token with write:packages scope'
        required: true
    outputs:
      new-version:
        value: ${{ jobs.release.outputs.new-version }}
      released:
        value: ${{ jobs.release.outputs.released }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    outputs:
      new-version: ${{ steps.sr.outputs.new_release_version }}
      released: ${{ steps.sr.outputs.new_release_published }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}

      # Con `.nvmrc` (o el archivo que diga `node-version-file`) el CI corre con
      # la misma version que el runtime del repo; `node-version` queda de respaldo
      # para los repos sin archivo. Para forzar `node-version`, pasar
      # `node-version-file: ''`. Cubierto por scripts/test-node-version-resolution.mjs.
      - name: Resolve Node version
        id: node
        shell: bash
        env:
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          NODE_VERSION_INPUT: ${{ inputs.node-version }}
        run: |
          set -euo pipefail
          file="${GITHUB_WORKSPACE}/${NODE_VERSION_FILE}"
          if [[ -n "$NODE_VERSION_FILE" && -f "$file" ]]; then
            version="$(head -n 1 "$file" | tr -d '[:space:]')"
            source="$NODE_VERSION_FILE"
          else
            version="$NODE_VERSION_INPUT"
            source="node-version"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version de Node invalida en ${source}: '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Node ${version} (desde ${source})"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jplannnou'

      - name: Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ${{ inputs.build-command }}

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/npm@12 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14

      - name: Run semantic-release
        id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: npx semantic-release
