name: Reusable private security

# Free security gate for private repositories. The runner is structurally
# constrained to self-hosted; callers only choose the local fleet label.

on:
  workflow_call:
    inputs:
      runner-label:
        description: "Local runner fleet label: gundo-local or jp-local"
        type: string
        required: true
      vulnerability-severity:
        description: "Trivy vulnerability and misconfiguration gate on push, schedule and manual runs"
        type: string
        default: "CRITICAL"
      pull-request-vulnerability-severity:
        description: >-
          Trivy gate on pull requests, kept separate on purpose. Dependency debt
          is a property of the repository, not of the change under review, so a
          stricter floor here blocks every merge until the backlog is cleared --
          including the merges that would clear it. The scheduled run keeps the
          stricter floor and still opens the incident. Lower this to match
          `vulnerability-severity` once the backlog reaches zero.
        type: string
        default: "CRITICAL"
      sast:
        description: "Run Semgrep OSS static analysis over the source tree"
        type: boolean
        default: true
      sast-severity:
        description: "Lowest Semgrep severity that fails the build: ERROR, WARNING or INFO"
        type: string
        default: "ERROR"
      sast-min-confidence:
        description: >-
          Lowest Semgrep rule confidence that fails the build: HIGH, MEDIUM or LOW.
          Semgrep OSS has no interprocedural taint analysis, so its LOW-confidence
          "detect-*" rules fire on any call shape regardless of whether the input is
          reachable from a user. They are reported but not blocking by default.
        type: string
        default: "MEDIUM"
      self-test:
        description: "Run synthetic detection tests before scanning the repository"
        type: boolean
        default: false
      notify-on-failure:
        description: "Create or update one repository issue when a scan fails"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Dependencies, configuration and secrets
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    timeout-minutes: 30
    concurrency:
      group: private-security-${{ inputs.runner-label }}
      cancel-in-progress: false
    env:
      GITLEAKS_VERSION: "8.30.1"
      TRIVY_VERSION: "v0.74.0"
      SEMGREP_VERSION: "1.175.0"
      # Semgrep phones home unless both of these are set. Neither the source nor
      # the findings ever leave the runner; only the ruleset name is requested.
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: false

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail

          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            Linux/ARM64) asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" ;;
            macOS/X64) asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz" ;;
            macOS/ARM64) asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" ;;
            Windows/X64) asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip" ;;
            Windows/ARM64) asset="gitleaks_${GITLEAKS_VERSION}_windows_arm64.zip" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}"; exit 1 ;;
          esac

          tool_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/gundo-gitleaks/${GITLEAKS_VERSION}"
          binary="${tool_root}/gitleaks"
          [[ "$RUNNER_OS" == 'Windows' ]] && binary="${binary}.exe"

          if [[ ! -f "$binary" ]]; then
            download_dir="${RUNNER_TEMP}/gitleaks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "$download_dir" "$tool_root"
            base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            curl --fail --silent --show-error --location "$base_url/$asset" --output "$download_dir/$asset"
            curl --fail --silent --show-error --location \
              "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
              --output "$download_dir/checksums.txt"

            expected="$(awk -v file="$asset" '$2 == file { print $1 }' "$download_dir/checksums.txt")"
            if command -v sha256sum >/dev/null 2>&1; then
              actual="$(sha256sum "$download_dir/$asset" | awk '{ print $1 }')"
            elif command -v shasum >/dev/null 2>&1; then
              actual="$(shasum -a 256 "$download_dir/$asset" | awk '{ print $1 }')"
            else
              echo '::error::No SHA-256 utility is available on the runner'
              exit 1
            fi
            if [[ -z "$expected" || "$actual" != "$expected" ]]; then
              echo '::error::Gitleaks checksum verification failed'
              exit 1
            fi

            if [[ "$asset" == *.zip ]] && command -v unzip >/dev/null 2>&1; then
              unzip -q "$download_dir/$asset" -d "$tool_root"
            else
              tar -xf "$download_dir/$asset" -C "$tool_root" gitleaks
            fi
            chmod +x "$binary"
          fi

          "$binary" version
          echo "$tool_root" >> "$GITHUB_PATH"

      - name: Install pinned Semgrep OSS
        if: inputs.sast
        shell: bash
        run: |
          set -euo pipefail

          # Kept in a versioned venv under the tool cache so repeated runs on the
          # same self-hosted runner reuse it instead of reinstalling every time.
          venv_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/gundo-semgrep/${SEMGREP_VERSION}"
          if [[ ! -x "$venv_root/bin/semgrep" ]]; then
            rm -rf "$venv_root"
            python3 -m venv "$venv_root"
            "$venv_root/bin/pip" install --quiet --disable-pip-version-check \
              "semgrep==${SEMGREP_VERSION}"
          fi

          "$venv_root/bin/semgrep" --version
          echo "$venv_root/bin" >> "$GITHUB_PATH"

      - name: Prove Semgrep detects a synthetic vulnerability
        if: inputs.sast && inputs.self-test
        shell: bash
        run: |
          set -euo pipefail

          fixture="${RUNNER_TEMP}/gundo-sast-self-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$fixture/.github/workflows"

          # Deliberately vulnerable: interpolating an issue title straight into a
          # shell. Semgrep rates this ERROR / HIGH confidence, so it exercises the
          # exact severity AND confidence path the real gate uses. A fixture that
          # only tripped a LOW-confidence rule would prove nothing about the gate.
          # Both marker strings are assembled at run time, and neither can be
          # written literally here -- not even inside this comment:
          #   - Actions expands an expression delimiter inside a run block before
          #     bash ever sees it, and it does so in comments too. Writing one
          #     literally either strips the injection out of the fixture or fails
          #     to parse the workflow outright.
          #   - This repository's contract validator rejects the literal name of a
          #     GitHub-hosted runner anywhere in this file, and it is right to.
          dollar='$'
          printf '%s\n' \
            'name: fixture' \
            'on: [issues]' \
            'jobs:' \
            '  demo:' \
            '    runs-on: self-hosted' \
            '    steps:' \
            "      - run: echo \"${dollar}{{ github.event.issue.title }}\"" \
            > "$fixture/.github/workflows/fixture.yml"

          grep -q 'github.event.issue.title' "$fixture/.github/workflows/fixture.yml" \
            || { echo '::error::The self-test fixture lost its injection marker'; exit 1; }

          semgrep scan --metrics=off --config p/default \
            --json --output "$fixture/report.json" "$fixture" || true
          hits="$(jq '[ .results[]?
                        | select(.extra.severity == "ERROR")
                        | select(.extra.metadata.confidence == "HIGH") ] | length' \
                     "$fixture/report.json")"
          if [[ "$hits" -lt 1 ]]; then
            echo '::error::Semgrep did not flag the synthetic shell injection at ERROR/HIGH'
            exit 1
          fi
          echo "Semgrep detected the synthetic fixture ($hits finding(s))."

      - name: Prove both scanners detect a synthetic secret
        if: inputs.self-test
        shell: bash
        run: |
          set -euo pipefail

          fixture="${RUNNER_TEMP}/gundo-security-self-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$fixture/repo"
          printf '%s\n' \
            'rules:' \
            '  - id: gundo-self-test' \
            '    category: test' \
            '    title: GUNDO synthetic secret' \
            '    severity: CRITICAL' \
            '    regex: GUNDO_SYNTHETIC_SECRET=[A-Z0-9]{32}' \
            > "$fixture/trivy-secret.yaml"
          printf '%s\n' \
            'title = "GUNDO self-test"' \
            '[[rules]]' \
            'id = "gundo-self-test"' \
            'description = "GUNDO synthetic secret"' \
            'regex = "GUNDO_SYNTHETIC_SECRET=[A-Z0-9]{32}"' \
            > "$fixture/gitleaks.toml"
          printf '%s\n' 'GUNDO_SYNTHETIC_SECRET=ABCDEFGHIJKLMNOPQRSTUVWXYZ123456' > "$fixture/repo/fixture.env"

          trivy fs \
            --scanners secret \
            --secret-config "$fixture/trivy-secret.yaml" \
            --format json \
            --output "$fixture/trivy.json" \
            "$fixture/repo"
          trivy_hits="$(jq '[.Results[]?.Secrets[]? | select(.RuleID == "gundo-self-test")] | length' "$fixture/trivy.json")"
          [[ "$trivy_hits" -ge 1 ]] || { echo '::error::Trivy did not detect the synthetic secret'; exit 1; }

          git -C "$fixture/repo" init --quiet
          git -C "$fixture/repo" config user.name 'GUNDO security self-test'
          git -C "$fixture/repo" config user.email 'security-self-test@gundo.test'
          git -C "$fixture/repo" add fixture.env
          git -C "$fixture/repo" commit --quiet -m 'synthetic secret fixture'
          gitleaks git \
            --config "$fixture/gitleaks.toml" \
            --report-format json \
            --report-path "$fixture/gitleaks.json" \
            --exit-code 0 \
            "$fixture/repo"
          gitleaks_hits="$(jq '[.[] | select(.RuleID == "gundo-self-test")] | length' "$fixture/gitleaks.json")"
          [[ "$gitleaks_hits" -ge 1 ]] || { echo '::error::Gitleaks did not detect the synthetic secret'; exit 1; }

          echo 'Both scanners detected the synthetic fixture.'

      - name: Scan dependencies and configuration
        id: dependencies
        continue-on-error: true
        shell: bash
        env:
          # En un pull_request el suelo es el de PR; en push, schedule y manual
          # es el estricto. `github.event_name` dentro de un reusable es el del
          # evento que disparo al caller, que es justo lo que hace falta aqui.
          TRIVY_SEVERITY: >-
            ${{ github.event_name == 'pull_request'
                && inputs.pull-request-vulnerability-severity
                || inputs.vulnerability-severity }}
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/gundo-trivy-cache"
          mkdir -p "$cache_dir"
          echo "Trivy severity floor for ${GITHUB_EVENT_NAME}: ${TRIVY_SEVERITY}"
          trivy fs \
            --cache-dir "$cache_dir" \
            --scanners vuln,misconfig \
            --include-dev-deps \
            --severity "$TRIVY_SEVERITY" \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs build \
            --skip-dirs coverage \
            --skip-dirs .next \
            .

      - name: Scan current files for secrets
        id: current-secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs build \
            --skip-dirs coverage \
            --skip-dirs .next \
            .

      - name: Scan Git history for secrets
        id: history-secrets
        continue-on-error: true
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          else
            log_opts='--all'
          fi

          gitleaks git --redact --no-banner --exit-code 1 --log-opts="$log_opts" .

      - name: Scan source for vulnerable code patterns
        id: sast
        if: inputs.sast
        continue-on-error: true
        shell: bash
        env:
          SAST_SEVERITY: ${{ inputs.sast-severity }}
          SAST_MIN_CONFIDENCE: ${{ inputs.sast-min-confidence }}
        run: |
          set -euo pipefail

          report="${RUNNER_TEMP}/semgrep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

          # Semgrep exits non-zero on findings; the verdict is computed below from
          # the report instead, so a clean run must not abort the step here.
          semgrep scan \
            --metrics=off \
            --config p/default \
            --config p/secrets \
            --exclude node_modules --exclude dist --exclude build \
            --exclude coverage --exclude .next --exclude .git \
            --exclude '*.min.js' \
            --json --output "$report" \
            . || true

          if [[ ! -s "$report" ]]; then
            echo '::error::Semgrep produced no report'
            exit 1
          fi

          # Semgrep mixes two severity vocabularies across rulesets, so both are
          # ranked onto one scale. A finding blocks only when it clears BOTH the
          # severity floor and the rule's own confidence floor; rules with no
          # confidence metadata are treated as MEDIUM so nothing is dropped silently.
          rank_filter='
            def rank:
              ascii_upcase
              | if . == "ERROR" or . == "CRITICAL" or . == "HIGH" then 3
                elif . == "WARNING" or . == "MEDIUM" then 2
                else 1 end;
            (env.SAST_SEVERITY | rank) as $floor
            | (env.SAST_MIN_CONFIDENCE | rank) as $cfloor
            | [ .results[]?
                | select((.extra.severity // "INFO" | rank) >= $floor)
                | select((.extra.metadata.confidence // "MEDIUM" | rank) >= $cfloor) ]'

          blocking="$(jq -r "$rank_filter | length" "$report")"
          total="$(jq -r '.results | length' "$report")"
          scan_errors="$(jq -r '.errors | length' "$report")"

          echo "Semgrep: ${total} finding(s), ${blocking} blocking (severity >= ${SAST_SEVERITY}, confidence >= ${SAST_MIN_CONFIDENCE}), ${scan_errors} scan error(s)."

          {
            echo "### Semgrep OSS"
            echo ""
            echo "- Findings: **${total}** total, **${blocking}** blocking"
            echo "- Blocking threshold: severity >= \`${SAST_SEVERITY}\`, confidence >= \`${SAST_MIN_CONFIDENCE}\`"
            echo ""
            jq -r "$rank_filter"' | .[]
              | "- `\(.check_id)` — \(.path):\(.start.line)"' "$report" | head -50
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r "$rank_filter"' | .[]
            | "::error file=\(.path),line=\(.start.line)::\(.check_id) — \(.extra.message // "" | split("\n")[0])"' "$report"

          [[ "$blocking" -eq 0 ]]

      - name: Create or update the security incident
        if: >-
          always() && inputs.notify-on-failure &&
          (steps.dependencies.outcome == 'failure' ||
          steps.current-secrets.outcome == 'failure' ||
          steps.history-secrets.outcome == 'failure' ||
          steps.sast.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const outcomes = {
              'Dependencias o configuración': '${{ steps.dependencies.outcome }}',
              'Secretos en archivos actuales': '${{ steps.current-secrets.outcome }}',
              'Secretos en el historial Git': '${{ steps.history-secrets.outcome }}',
              'Código vulnerable (Semgrep)': '${{ steps.sast.outcome }}',
            };
            const failures = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => `- ${name}`);
            const title = '🔴 Seguridad privada: escaneo local fallido';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'La guarda local de seguridad detectó un problema en:',
              '',
              ...failures,
              '',
              `Ejecución: ${runUrl}`,
              '',
              'El informe detallado está redactado en los logs del run. Esta incidencia se actualiza en vez de duplicarse.',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Actualizada la incidencia #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Creada la incidencia #${created.data.number}`);
            }

      - name: Fail when a scanner found a problem
        if: >-
          always() &&
          (steps.dependencies.outcome == 'failure' ||
          steps.current-secrets.outcome == 'failure' ||
          steps.history-secrets.outcome == 'failure' ||
          steps.sast.outcome == 'failure')
        shell: bash
        run: |
          echo '::error::The private security scan found a blocking issue. Review the failed scanner step and repository incident.'
          exit 1
